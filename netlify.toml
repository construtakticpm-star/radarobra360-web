[build]
  functions = "netlify/functions"
  publish = "."

[[redirects]]
  from = "/app"
  to = "/.netlify/functions/app"
  status = 200

[[redirects]]
  from = "/app/proyecto-crear"
  to = "/.netlify/functions/app-proyecto-crear"
  status = 200

[[redirects]]
  from = "/app/usuarios"
  to = "/.netlify/functions/app-usuarios"
  status = 200

[[redirects]]
  from = "/app/contacto"
  to = "/.netlify/functions/app-contacto"
  status = 200

[[redirects]]
  from = "/app/sugerencia-crear"
  to = "/.netlify/functions/app-sugerencia-crear"
  status = 200

[[redirects]]
  from = "/app/usuario-crear"
  to = "/.netlify/functions/app-usuario-crear"
  status = 200

[[redirects]]
  from = "/app/punto"
  to = "/.netlify/functions/app-punto"
  status = 200

[[redirects]]
  from = "/app/registrar"
  to = "/.netlify/functions/app-registrar"
  status = 200

[[redirects]]
  from = "/app/submit"
  to = "/.netlify/functions/app-submit"
  status = 200

[[redirects]]
  from = "/app/registro-editar"
  to = "/.netlify/functions/app-registro-editar"
  status = 200

[[redirects]]
  from = "/app/media"
  to = "/.netlify/functions/app-media"
  status = 200

[[redirects]]
  from = "/app/media-delete"
  to = "/.netlify/functions/app-media-delete"
  status = 200

[[redirects]]
  from = "/app/plano"
  to = "/.netlify/functions/app-plano"
  status = 200

[[redirects]]
  from = "/app/plano-upload"
  to = "/.netlify/functions/app-plano-upload"
  status = 200

[[redirects]]
  from = "/app/plano-pin"
  to = "/.netlify/functions/app-plano-pin"
  status = 200

[[redirects]]
  from = "/app/plano-unpin"
  to = "/.netlify/functions/app-plano-unpin"
  status = 200

# Block direct static access to function source.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true
